{% load static ui %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Analysis · PAUT Reports{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {# The Analysis app's own frame: the whole window, no app navigation; the same theme as the rest of the app #}
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link rel="icon" href="{% static 'reports/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'reports/vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'reports/vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static_v 'reports/css/app.css' %}">
    {% block styles %}{% endblock %}
</head>
<body class="analysis-body">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
