<div class="setup-block" data-form-index="{{ idx }}">
    {{ form.id }}
    <div hidden>{{ form.DELETE }}</div>

    <div class="setup-block-header">
        <span class="setup-block-title">Setup #{{ num }}</span>
        <div class="d-flex align-items-center gap-2">
            <select class="form-select form-select-sm setup-loader" data-form-prefix="setups-{{ idx }}" aria-label="Fill from a saved setup">
                <option value="">Fill from saved setup…</option>
                {% if saved_setups.saved %}
                <optgroup label="Saved setups">
                    {% for s in saved_setups.saved %}
                    <option value="{{ s.pk }}">#{{ s.pk }} · {{ s.scope_model|default:"—" }} · {{ s.transducer_model|default:"—" }}</option>
                    {% endfor %}
                </optgroup>
                {% endif %}
                {% if saved_setups.in_reports %}
                <optgroup label="From other reports">
                    {% for s in saved_setups.in_reports %}
                    <option value="{{ s.pk }}">#{{ s.pk }} (report #{{ s.report_id }}) · {{ s.scope_model|default:"—" }} · {{ s.transducer_model|default:"—" }}</option>
                    {% endfor %}
                </optgroup>
                {% endif %}
            </select>
            <button type="button" class="btn btn-ghost-danger btn-sm remove-setup" title="Remove this setup">
                <i class="bi bi-trash"></i> Remove
            </button>
        </div>
    </div>

    {% for title, fields in form.fieldsets %}
    <h3 class="panel-subtitle{% if forloop.first %} mt-0{% endif %}">{{ title }}</h3>
    <div class="field-grid cols-4">
        {% for field in fields %}{{ field.as_field_group }}{% endfor %}
    </div>
    {% endfor %}
</div>
