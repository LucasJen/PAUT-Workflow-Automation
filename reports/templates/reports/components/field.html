<div class="field{% if field.errors %} has-error{% endif %}" data-field="{{ field.name }}">
    {% if field.label %}{{ field.label_tag }}{% endif %}
    {{ field }}
    {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
</div>
