{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PAUT Report Automation{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'reports/css/base_styles.css'%}">
    {% block styles %}{% endblock %}
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Main content -->
        <div class="col content-wrapper">

            <div class="app-header mb-4">
                <h1 class="app-title">PAUT Report Automation</h1>
            </div>

            {% block content %}
            {% endblock %}

            <footer>
                © {% now "Y" %} No touchy
            </footer>

        </div>

        <!-- Right Sidebar -->
        <div class="col-lg-auto sidebar">

            <h6 class="text-uppercase text-muted mb-3">Navigation</h6>

            <a href="{% url 'create-report' %}">Long Form Report</a>
            <a href="{% url 'report-list'%}">Report list</a>


            <hr>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
