{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PAUT Report Automation{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Static Stylesheet-->
    <link rel="stylesheet" href="{% static 'reports/css/base_styles.css'%}">
    {% block styles %}{% endblock %}
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Main content -->
        <div class="col content-wrapper">

            <div class="app-header mb-4 d-flex align-items-center justify-content-between">
                <h1 class="app-title">PAUT Report Automation</h1>
                <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle navigation">&#9776;</button>
            </div>

            {% block content %}
            {% endblock %}

            <footer>
                © {% now "Y" %} No touchy
            </footer>
        </div>

        <!-- Navigation Sidebar -->
        <div class="col-lg-auto sidebar">

            <h6 class="text-uppercase text-muted mb-3">Navigation</h6>
            
            <a href="{% url 'home'%}">Home</a>
            <a href="{% url 'create-report' %}">Long Form Report</a>
            <a href="{% url 'report-list'%}">Report list</a>
            <a href="{% url 'setup-list'%}">Setups</a>
            <a href="{% url 'nde-upload' %}">NDE Parser</a>

            <hr>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">☾ Dark Mode</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const sidebar = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle');

    if (localStorage.getItem('sidebarCollapsed') === 'true') {
        sidebar.classList.add('collapsed');
    }

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    });

    // Dark mode
    const themeBtn = document.getElementById('theme-toggle');

    function setTheme(dark) {
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        themeBtn.textContent = dark ? '☀ Light Mode' : '☾ Dark Mode';
        localStorage.setItem('darkMode', dark);
    }

    setTheme(localStorage.getItem('darkMode') === 'true');

    themeBtn.addEventListener('click', () => {
        setTheme(document.documentElement.getAttribute('data-bs-theme') !== 'dark');
    });
</script>

</body>
</html>
